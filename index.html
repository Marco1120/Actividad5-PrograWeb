<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema | Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo de estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wrapper">
    <!-- SIDEBAR -->
    <div id="sidebar" class="text-white p-3">
        <h4 class="text-center">Mi Sistema</h4>
        <hr>
        <ul class="nav flex-column">
            <!-- Menú Desplegable de Usuarios -->
            <li class="nav-item">
                <a class="nav-link text-white" data-bs-toggle="collapse" href="#menuUsuarios" role="button">
                    👥 Usuarios ▼
                </a>
                <div class="collapse" id="menuUsuarios">
                    <ul class="nav flex-column ms-3">
                        <li><a href="#" class="nav-link text-light" onclick="mostrarPantalla('pantallaUsuarios')">Captura</a></li>
                    </ul>
                </div>
            </li>
            <!-- Opción directa a Alumnos -->
            <li class="nav-item mt-2">
                <a href="#" class="nav-link text-white" onclick="mostrarPantalla('pantallaAlumnos')">🎓 Alumnos</a>
            </li>
        </ul>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="page-content">
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-3">
            <!-- Botón Hamburguesa -->
            <button class="btn btn-outline-dark me-3" onclick="toggleSidebar()">☰</button>
            
            <div class="ms-auto dropdown">
                <!-- Muestra el correo del usuario logueado -->
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" id="nombreUsuarioNavbar">
                    Cargando usuario...
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Salir del sistema</a></li>
                </ul>
            </div>
        </nav>

        <div class="container mt-4">
            
            <!-- FORMULARIO: CAPTURA DE USUARIOS -->
            <div id="pantallaUsuarios" class="card shadow-sm p-4 mb-4">
                <h3 class="mb-4">Captura de Usuarios</h3>
                <form id="formUsuarios">
                    <div class="mb-3">
                        <label class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="nombreCaptura" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correoCaptura" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="passCaptura" required>
                        <small class="text-muted">Debe contener mayúscula, minúscula, número, especial y min 8 caracteres.</small>
                    </div>
                    <button type="button" class="btn btn-success" onclick="registrarUsuario()">Guardar Usuario</button>
                </form>
            </div>

            <!-- FORMULARIO: ALUMNOS (Oculto por defecto) -->
            <div id="pantallaAlumnos" class="card shadow-sm p-4 d-none">
                <h3 class="mb-4">Registro de Alumnos</h3>
                <form id="formAlumnos">
                    <div class="mb-3">
                        <label class="form-label">Número de Control (6 dígitos)</label>
                        <input type="number" class="form-control" id="numControl" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento" required>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="verificarAlumno()">Verificar Alumno</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- MODAL DE EDAD -->
<div class="modal fade" id="modalEdad" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Resultado de Verificación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="mensajeModalEdad"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts requeridos -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 1ro cargamos la librería de validaciones -->
<script src="js/utileria.js"></script>
<!-- 2do cargamos la lógica del dashboard -->
<script src="js/app.js"></script>
</body>
</html>
