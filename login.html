<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <!-- Bootstrap 5 para el diseño rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo de estilos personalizados -->
    <link rel="stylesheet" href="css/login.css">
    
    <script src="js/utileria.js"></script>
    <script src="js/login.js"></script>
    
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        
        <img src="img/logo.jpg" alt="Logo" width="80" class="d-block mx-auto mb-3">
        
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        
        <form id="formLogin">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <!-- Type email ayuda con validación nativa del navegador -->
                <input type="email" class="form-control" id="correo" placeholder="usuario@correo.com" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
            </div>

            <!-- Mensaje de error oculto por defecto (d-none) -->
            <div id="mensajeError" class="alert alert-danger d-none text-center" role="alert">
                El correo no es válido o la contraseña no es segura.
            </div>

            <button type="button" class="btn btn-primary w-100 mt-2" onclick="procesarLogin()">Ingresar</button>
        </form>
    </div>
</body>
</html>
